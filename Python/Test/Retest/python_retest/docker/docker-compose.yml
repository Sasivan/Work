services:
  mysql:
    image: mysql:8.0
    container_name: python_retest_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-PythonRetest_2026!}
    ports:
      - "3307:3306"
    volumes:
      - python_retest_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  python_retest_mysql_data:
