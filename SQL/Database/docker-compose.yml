services:
  postgres:
    image: postgres:16
    container_name: Practice
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sasivan
      POSTGRES_DB: practice

    ports:
      - "5432:5432"

    volumes:
      - intern_tests_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intern_tests_postgres_data: