services:
  mysql:
    image: mysql:8.0
    container_name: sql_mock_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "InternTest_2026!"
    ports:
      - "3308:3306"
    volumes:
      - sql_mock_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pInternTest_2026!"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  sql_mock_mysql_data:
